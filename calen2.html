<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horizontal Timeline Calendar</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a, #1e1b4b, #311042);
      --glass-bg: rgba(255, 255, 255, 0.07);
      --glass-border: rgba(255, 255, 255, 0.15);
      --accent-color: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.5);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--text-main);
      overflow: hidden;
      padding: 20px;
    }

    .calendar-wrapper {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      padding: 30px;
      border-radius: 24px;
      width: 100%;
      max-width: 1000px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .month-year {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(to right, #fff, var(--text-muted));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-buttons {
      display: flex;
      gap: 10px;
    }

    .nav-btn {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      padding: 10px 16px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.3);
    }

    /* The Timeline track */
    .timeline-container {
      display: flex;
      gap: 15px;
      overflow-x: auto;
      padding: 20px 5px;
      scroll-behavior: smooth;
      scrollbar-width: thin;
      scrollbar-color: var(--glass-border) transparent;
    }

    .timeline-container::-webkit-scrollbar {
      height: 6px;
    }

    .timeline-container::-webkit-scrollbar-thumb {
      background: var(--glass-border);
      border-radius: 10px;
    }

    /* Individual Day Card */
    .day-card {
      flex: 0 0 85px;
      height: 120px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: transform 0.2s, background-color 0.2s;
      cursor: pointer;
    }

    .day-card:hover {
      transform: translateY(-5px);
      background: rgba(255, 255, 255, 0.12);
    }

    .day-name {
      font-size: 0.85rem;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 8px;
    }

    .day-number {
      font-size: 1.6rem;
      font-weight: 700;
    }

    /* Highlight Today */
    .day-card.today {
      background: var(--accent-color);
      border-color: var(--accent-color);
      box-shadow: 0 0 20px var(--accent-glow);
    }

    .day-card.today .day-name {
      color: rgba(255, 255, 255, 0.75);
    }
    
    .day-card.today .day-number {
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="calendar-wrapper">
    <div class="calendar-header">
      <div class="month-year" id="monthYearDisplay">October 2026</div>
      <div class="nav-buttons">
        <button class="nav-btn" id="prevBtn">Prev</button>
        <button class="nav-btn" id="nextBtn">Next</button>
      </div>
    </div>

    <div class="timeline-container" id="timelineContainer">
      <!-- Generated by JavaScript -->
    </div>
  </div>

  <script>
    const monthYearDisplay = document.getElementById('monthYearDisplay');
    const timelineContainer = document.getElementById('timelineContainer');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    let currentDate = new Date();

    const months = [
      "January", "February", "March", "April", "May", "June",
      "July", "August", "September", "October", "November", "December"
    ];
    
    const daysShort = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

    function renderTimelineCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      // Set header text
      monthYearDisplay.textContent = `${months[month]} ${year}`;

      // Clear previous elements
      timelineContainer.innerHTML = '';

      // Get total days in target month
      const totalDays = new Date(year, month + 1, 0).getDate();
      
      const realToday = new Date();
      let todayCard = null;

      for (let day = 1; day <= totalDays; day++) {
        const dateObj = new Date(year, month, day);
        const dayName = daysShort[dateObj.getDay()];

        const card = document.createElement('div');
        card.classList.add('day-card');

        // Check if this card represents actual today
        if (
          day === realToday.getDate() &&
          month === realToday.getMonth() &&
          year === realToday.getFullYear()
        ) {
          card.classList.add('today');
          todayCard = card;
        }

        card.innerHTML = `
          <span class="day-name">${dayName}</span>
          <span class="day-number">${day}</span>
        `;

        timelineContainer.appendChild(card);
      }

      // Auto-scroll to current day if inside active view
      if (todayCard) {
        setTimeout(() => {
          todayCard.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        }, 100);
      }
    }

    prevBtn.addEventListener('click', () => {
      currentDate.setMonth(currentDate.getMonth() - 1);
      renderTimelineCalendar();
    });

    nextBtn.addEventListener('click', () => {
      currentDate.setMonth(currentDate.getMonth() + 1);
      renderTimelineCalendar();
    });

    // Initialize layout
    renderTimelineCalendar();
  </script>
</body>
</html>
